schema_version: 1
experiment:
  name: sarsa_lambda_full
  condition: sarsa_lambda
  training_seed: 0
  episodes: 4000
  max_environment_steps: 60000
environment: {id: MountainCar-v0, max_episode_steps: 200}
agent:
  type: sarsa_lambda
  alpha: 0.4
  gamma: 0.99
  lambda: 0.9
  trace_type: replacing
  trace_clip: 10.0
  epsilon: {start: 1.0, end: 0.05, decay_steps: 20000}
  # Locked validation choice: 16 tilings, with the lowest successful-step
  # median among candidates tied on assignment success and completion.
  tile_coder: {num_tilings: 16, tiles_per_dim: [8, 8]}
training: {validation_interval_steps: 10000, snapshot_interval_episodes: 50}
logging:
  output_dir: results/raw/full/sarsa_lambda_seed0
  checkpoint_dir: checkpoints/full/sarsa_lambda_seed0
  record_training_trajectories: false
  record_validation_trajectories: true
reproducibility: {deterministic_torch: true, device: cpu}
evaluation:
  validation_episode_seeds: [1000, 1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009, 1010, 1011, 1012, 1013, 1014, 1015, 1016, 1017, 1018, 1019]
